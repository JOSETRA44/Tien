// ═══════════════════════════════════════════════════════════════════════════
//  Tien — Compose compiler stability configuration
//
//  The Compose compiler infers stability from Kotlin source. It cannot see
//  inside JDK classes, so it conservatively treats every one of them as
//  unstable — which then infects any composable that takes one as a parameter,
//  and any class that holds one.
//
//  Listing a class here tells the compiler to treat it as stable. That is only
//  sound for genuinely immutable types, so every entry below is one whose
//  immutability is guaranteed by its own specification.
//
//  Verify the effect with:
//    ./gradlew :app:compileDebugKotlin -PcomposeCompilerReports=true --rerun-tasks
//    → app/build/compose-reports/app_debug-composables.txt
// ═══════════════════════════════════════════════════════════════════════════

// java.time — the whole package is documented as immutable and thread-safe.
// LocalDate reaches Compose through DayStrip and the agenda's day grouping.
java.time.*

// Locale is immutable (its setters were removed in Java 7). Reaches Compose
// via DateTimeLabels.
java.util.Locale

// Kotlin's read-only collection *interface*. This is the one entry that is a
// judgement call rather than a guarantee: `List` can be backed by a mutable
// ArrayList. It is sound here because every list handed to a composable
// originates in an `@Immutable` UI state object that the ViewModel only ever
// replaces wholesale — never mutates in place. If that stops being true,
// remove this line and switch the UI state to kotlinx.collections.immutable.
kotlin.collections.List
