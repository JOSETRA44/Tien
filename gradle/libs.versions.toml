[versions]
agp = "8.13.2"
kotlin = "2.0.21"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
lifecycleViewModel = "2.8.7"
navigationCompose = "2.8.5"
datastore = "1.1.1"
coroutines = "1.9.0"
turbine = "1.2.0"
desugarJdkLibs = "2.1.3"
# 4.x rather than 5.x: 5.x raises the Android floor above this project's minSdk 24.
okhttp = "4.12.0"
jsoup = "1.23.1"
# 1.23.8 is the last 1.x line, built against Kotlin 2.0.21 — the exact compiler
# this project uses. The 2.0 alphas target Kotlin 2.4 and would mismatch.
detekt = "1.23.8"
# 1.4.x builds against lint 31.x (AGP 8.x). 1.5.x moved to lint 32 / AGP 9 and
# would be skipped at runtime by this AGP.
composeLintChecks = "1.4.2"
leakcanary = "2.14"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

# ── Módulo :dutic — cliente del aula virtual ─────────────────────────────────
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
# Moodle renders grades and profiles as HTML only; Jsoup is what reads them.
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }

# Backports java.time (and friends) to the minSdk 24 floor.
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# ── Jetpack Compose ──────────────────────────────────────────────────────────
androidx-compose-bom                 = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui                  = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics         = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview  = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling          = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-junit4      = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest    = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3           = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# ── Compose integration ──────────────────────────────────────────────────────
androidx-activity-compose            = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewModel" }
androidx-lifecycle-runtime-ktx       = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleViewModel" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleViewModel" }
androidx-navigation-compose          = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# ── User preference persistence ──────────────────────────────────────────────
androidx-datastore-preferences       = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# ── Coroutines (declared explicitly, not inherited transitively) ─────────────
kotlinx-coroutines-android           = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test              = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# ── Tests ────────────────────────────────────────────────────────────────────
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

# ── Análisis estático y diagnóstico ──────────────────────────────────────────
# Wraps ktlint as a detekt ruleset, so formatting and static analysis run from
# one task instead of two competing plugins.
detekt-formatting = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }

# Compose-specific lint rules: unstable parameters, missing modifiers, state
# hoisting mistakes. Plain Android Lint knows nothing about these.
compose-lint-checks = { group = "com.slack.lint.compose", name = "compose-lint-checks", version.ref = "composeLintChecks" }

# Debug-only. Watches Activities, Fragments, ViewModels and services for
# retained instances after they should have been collected.
leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

[plugins]
android-application  = { id = "com.android.application", version.ref = "agp" }
android-library      = { id = "com.android.library", version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler     = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt               = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
